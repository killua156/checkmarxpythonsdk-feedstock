schema_version: 1

context:
  version: "1.9.1"

package:
  name: checkmarxpythonsdk
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/83/1d/84bf6c75d806921b496ab46e321cd213e9638feb310b88b89cf39340ede7/checkmarxpythonsdk-${{ version }}.tar.gz
  sha256: 1a42c106c8ad43fe0bf8cfcecbf73d4fa9aaf7fbf53686d4d2e48243b6251b6c
  patches:
    - patches/0001-depend-on-suds-rather-than-suds-community.patch

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - httpx >=0.28.1
    - suds >=1.2.0
    - deprecated >=1.2.13,<1.3
    - inflection >=0.5.1

tests:
  - python:
      imports:
        - CheckmarxPythonSDK
        - CheckmarxPythonSDK.api_client
        - CheckmarxPythonSDK.configuration
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/checkmarx-ts/checkmarx-python-sdk
  repository: https://github.com/checkmarx-ts/checkmarx-python-sdk
  license: GPL-3.0-only
  license_file: LICENSE
  summary: Checkmarx Python SDK
  description: |
    A Python wrapper for the Checkmarx APIs, covering the CxSAST and CxOSA
    REST APIs, the Portal SOAP API, the CxSAST OData API and the CxSCA and
    CxOne REST APIs.

extra:
  recipe-maintainers:
    - JFreitas9
    - killua156
